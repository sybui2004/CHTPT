services:
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      # Local filebeat config
      - ./elk/filebeat-app-vm.yml:/usr/share/filebeat/filebeat.yml:ro
      # App logs folder (same folder your app compose writes to)
      - ./logs:/logs:ro
      - ./logs:/app/logs:ro
      # Filebeat internal data
      - filebeat-data:/usr/share/filebeat/data
    environment:
      # Identify this VM
      - HOSTNAME=${HOSTNAME:-app-vm}
      - HOST_IP=${HOST_IP:-unknown}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - LOG_TYPE=${LOG_TYPE:-btl}

      # Central logstash endpoint (IP of ELK VM)
      - LOGSTASH_HOST=${LOGSTASH_HOST:-127.0.0.1:5044}
    restart: unless-stopped

  front-end:
    build: ./frontend/.
    container_name: front-end
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sunstack_network

  gateway:
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: mongodb://root:root@mongo:27017
      MONGO_DATABASE: ${AUTH_MONGO_DATABASE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8002:8002"
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: mongodb://root:root@mongo:27017
      MONGO_DATABASE: ${USER_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      SHOP_SERVICE_URL: ${SHOP_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
