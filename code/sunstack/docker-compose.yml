    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: mongodb://root:root@mongo:27017
      MONGO_DATABASE: ${PAYMENT_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VNPAY_URL: ${VNPAY_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
