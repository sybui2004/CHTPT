services:
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./elk/filebeat-app-vm.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
      - ./logs:/app/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    environment:
      - HOSTNAME=${HOSTNAME:-app-vm}
      - HOST_IP=${HOST_IP:-unknown}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - LOG_TYPE=${LOG_TYPE:-btl}
      - LOGSTASH_HOST=${LOGSTASH_HOST}
    restart: unless-stopped

  front-end:
    build: ./frontend/.
    container_name: front-end
    env_file:
      - ./.env
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    networks:
      - sunstack_network

  gateway:
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${AUTH_MONGO_DATABASE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${USER_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  product-service:
    build:
      context: ./backend
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${PRODUCT_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  order-service:
    build:
      context: ./backend
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${ORDER_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  shop-service:
    build:
      context: ./backend
      dockerfile: services/shop-service/Dockerfile
    container_name: shop-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${SHOP_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${PAYMENT_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VNPAY_URL: ${VNPAY_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  chat-service:
    build:
      context: ./backend
      dockerfile: services/chat-service/Dockerfile
    container_name: chat-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${CHAT_MONGO_DATABASE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  upload-service:
    build:
      context: ./backend
      dockerfile: services/upload-service/Dockerfile
    container_name: upload-service
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-7}
    volumes:
      - ./backend/services/upload-service/secrets:/app/secrets:ro
      - ./logs:/app/logs
    depends_on:
      auth-service:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  mongo:
    image: mongo:6
    container_name: btl-mongo-1
    profiles:
      - local-db
    command: mongod --replSet my-mongo-set --bind_ip_all
    volumes:
      - ./databases/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunstack_network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    profiles:
      - admin
    ports:
      - "${PROD_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
      ME_CONFIG_MONGODB_URL: ${MONGO_URI}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-root}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-root}
    networks:
      - sunstack_network
    depends_on:
      mongo:
        condition: service_healthy

  mongo_init:
    image: mongo:6
    profiles:
      - local-db
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: |
      sh -c 'sleep 10; mongosh --host mongo --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: \"my-mongo-set\", members: [{ _id: 1, host: \"mongo:27017\" }]}) }"; until mongosh --host mongo --quiet --eval "db.isMaster().ismaster" | grep -q "true"; do sleep 2; done; mongosh --host mongo --quiet --eval "const admin = db.getSiblingDB(\"admin\"); if (!admin.getUser(\"root\")) { admin.createUser({user: \"root\", pwd: \"root\", roles: [{ role: \"root\", db: \"admin\" }, { role: \"readWrite\", db: \"bdc\" }, { role: \"readWrite\", db: \"auth_db\" }, { role: \"readWrite\", db: \"user_db\" }, { role: \"readWrite\", db: \"order_db\" }, { role: \"readWrite\", db: \"shop_db\" }, { role: \"readWrite\", db: \"payment_db\" }, { role: \"readWrite\", db: \"chat_db\" }]}) }"'
    networks:
      - sunstack_network

  mongo_import:
    build: ./databases/mongo_import_prod
    container_name: mongo_import
    profiles:
      - import
    command: ["node", "app.js"]
    environment:
      MONGO_URI: ${MONGO_URI}
      AUTH_MONGO_DATABASE: ${AUTH_MONGO_DATABASE:-auth_db}
      SHOP_MONGO_DATABASE: ${SHOP_MONGO_DATABASE:-shop_db}
    restart: "no"
    networks:
      - sunstack_network

  mongo_seed:
    build: ./databases/mongo_import_prod
    container_name: mongo_seed
    profiles:
      - import
    command: ["node", "seed_demo_products.js"]
    environment:
      MONGO_URI: ${MONGO_URI}
      AUTH_MONGO_DATABASE: ${AUTH_MONGO_DATABASE:-auth_db}
      SHOP_MONGO_DATABASE: ${SHOP_MONGO_DATABASE:-shop_db}
      PRODUCT_MONGO_DATABASE: ${PRODUCT_MONGO_DATABASE:-product_db}
    depends_on:
      mongo_import:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - sunstack_network

  redis:
    image: redis:7
    volumes:
      - ./databases/redis_data:/data
    networks:
      - sunstack_network

networks:
  sunstack_network:
    driver: bridge
    name: sunstack_network

volumes:
  filebeat-data:

