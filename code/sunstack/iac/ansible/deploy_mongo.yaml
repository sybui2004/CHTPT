- name: Deploy shared MongoDB VM
  hosts: btl_mongo
  become: yes
  vars:
    mongo_app_root: /opt/btl-mongo
    mongo_data_root: /opt/btl-mongo/data
    mongo_import_root: /opt/btl-mongo/mongo_import_prod
    mongo_deploy_user: "{{ ansible_user | default(ansible_ssh_user) | default('sy') }}"
    btl_repo_root: "{{ playbook_dir }}/../.."
    mongo_username: root
    mongo_password: root
    auth_db_uri: "mongodb://{{ mongo_username }}:{{ mongo_password }}@mongo:27017/auth_db?directConnection=true&authSource=admin"
    shop_db_uri: "mongodb://{{ mongo_username }}:{{ mongo_password }}@mongo:27017/shop_db?directConnection=true&authSource=admin"
    product_db_uri: "mongodb://{{ mongo_username }}:{{ mongo_password }}@mongo:27017/product_db?directConnection=true&authSource=admin"
    mongo_app_hosts: "{{ groups.get('btl_app', []) }}"
  tasks:
    - name: Install system packages
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - rsync
          - software-properties-common
          - python3-pip
          - ufw
        state: present
        update_cache: true

    - name: Add Docker GPG apt key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create MongoDB directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0755"
        recurse: yes
      loop:
        - path: "{{ mongo_app_root }}"
          owner: root
          group: root
        - path: "{{ mongo_data_root }}"
          owner: "999"
          group: "999"
        - path: "{{ mongo_import_root }}"
          owner: "{{ mongo_deploy_user }}"
          group: "{{ mongo_deploy_user }}"

    - name: Copy MongoDB import project
      become: no
      synchronize:
        src: "{{ btl_repo_root }}/databases/mongo_import_prod/"
        dest: "{{ mongo_import_root }}/"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"

    - name: Configure shared MongoDB compose
      copy:
        dest: "{{ mongo_app_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        content: |
          services:
            mongo:
              image: mongo:6
              container_name: btl-shared-mongo
              command: mongod --bind_ip_all
              restart: unless-stopped
              ports:
                - "0.0.0.0:27017:27017"
              environment:
                MONGO_INITDB_ROOT_USERNAME: {{ mongo_username }}
                MONGO_INITDB_ROOT_PASSWORD: {{ mongo_password }}
              volumes:
                - ./data:/data/db
              healthcheck:
                test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
                interval: 10s
                timeout: 5s
                retries: 5

            mongo_init:
              image: mongo:6
              depends_on:
                mongo:
                  condition: service_healthy
              entrypoint: |
                sh -c 'mongosh --host mongo -u "{{ mongo_username }}" -p "{{ mongo_password }}" --authenticationDatabase admin --quiet --eval "db.adminCommand({ ping: 1 })"'

            mongo_import:
              build: ./mongo_import_prod
              container_name: btl-mongo-import
              profiles:
                - import
              command: ["node", "app.js"]
              environment:
                AUTH_DB_URI: "{{ auth_db_uri }}"
                SHOP_DB_URI: "{{ shop_db_uri }}"
              depends_on:
                mongo_init:
                  condition: service_completed_successfully
              restart: "no"

            mongo_seed:
              build: ./mongo_import_prod
              container_name: btl-mongo-seed
              profiles:
                - import
              command: ["node", "seed_demo_products.js"]
              environment:
                AUTH_DB_URI: "{{ auth_db_uri }}"
                SHOP_DB_URI: "{{ shop_db_uri }}"
                PRODUCT_DB_URI: "{{ product_db_uri }}"
              depends_on:
                mongo_import:
                  condition: service_completed_successfully
              restart: "no"

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow MongoDB from BTL app VMs only
      community.general.ufw:
        rule: allow
        port: "27017"
        proto: tcp
        src: "{{ hostvars[item].ansible_host | default(item) }}"
      loop: "{{ mongo_app_hosts }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Start shared MongoDB
      command: docker compose -f docker-compose.yml up -d --remove-orphans mongo mongo_init
      args:
        chdir: "{{ mongo_app_root }}"

    - name: Build MongoDB import jobs
      command: docker compose -f docker-compose.yml --profile import build mongo_import mongo_seed
      args:
        chdir: "{{ mongo_app_root }}"

    - name: Run MongoDB import and seed jobs
      command: docker compose -f docker-compose.yml --profile import up --force-recreate --abort-on-container-exit --exit-code-from mongo_seed mongo_import mongo_seed
      args:
        chdir: "{{ mongo_app_root }}"

    - name: Show shared MongoDB status
      command: docker compose -f docker-compose.yml ps
      args:
        chdir: "{{ mongo_app_root }}"
      register: mongo_compose_ps
      changed_when: false

    - name: Print shared MongoDB status
      debug:
        var: mongo_compose_ps.stdout_lines
