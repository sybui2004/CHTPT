- name: Create shared MongoDB Compute Engine instance
  hosts: localhost
  vars:
    project_id: shopbee-485000
    zone: asia-southeast1-b
    machine_type: e2-standard-2
    disk_size_gb: 50
    mongo_instance_name: btl-mongo-vm
    service_account_file: "{{ playbook_dir }}/secrets/shopbee-485000-8459e98cfb12.json"
  tasks:
    - name: Bring up shared MongoDB instance
      google.cloud.gcp_compute_instance:
        name: "{{ mongo_instance_name }}"
        machine_type: "{{ machine_type }}"
        zone: "{{ zone }}"
        project: "{{ project_id }}"
        auth_kind: serviceaccount
        service_account_file: "{{ service_account_file }}"
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
              disk_size_gb: "{{ disk_size_gb }}"
              disk_type: pd-ssd
        network_interfaces:
          - network:
              selfLink: global/networks/default
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        state: present

    - name: Allow shared MongoDB traffic at GCP firewall
      google.cloud.gcp_compute_firewall:
        name: allow-btl-shared-mongo
        network:
          selfLink: global/networks/default
        allowed:
          - ip_protocol: TCP
            ports:
              - '27017'
        source_ranges:
          - 0.0.0.0/0
        direction: INGRESS
        description: Allow shared MongoDB traffic; VM UFW restricts access to BTL app VM IPs
        project: "{{ project_id }}"
        auth_kind: serviceaccount
        service_account_file: "{{ service_account_file }}"
        state: present
