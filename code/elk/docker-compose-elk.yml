# ELK Central VM (CentralLogHub-like) for BTL
# Run this compose on the dedicated ELK VM.
# Exposes:
# - 9200 Elasticsearch
# - 5601 Kibana
# - 5044 Logstash (Beats input from Filebeat agents)

services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elk-elastic
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-myelasticpass}
      - xpack.security.http.ssl.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - ./data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: elk-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash.yml:/usr/share/logstash/config/logstash.yml
    environment:
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-myelasticpass}
      - ELASTIC_HOSTS=http://elastic:9200
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ALERT_THROTTLE_SECONDS=${ALERT_THROTTLE_SECONDS:-60}
    depends_on:
      - elastic
    ports:
      - "5044:5044"
    networks:
      - elk_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: elk-kibana
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: '"http://elastic:9200"'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-kibanapass}
    ports:
      - "5601:5601"
    depends_on:
      - elastic
    networks:
      - elk_network

networks:
  elk_network:
    driver: bridge
    name: elk_network
