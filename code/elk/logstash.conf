input {
  beats {
    port => 5044
    client_inactivity_timeout => 300
  }
}

filter {
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:app_ts}Z\s+%{LOGLEVEL:log_level}\s+%{DATA:logger}\s+%{GREEDYDATA:log_event}$" }
    tag_on_failure => ["_grok_app_failed"]
  }

  if [app_ts] {
    date {
      match => ["app_ts", "ISO8601"]
      timezone => "Asia/Ho_Chi_Minh"
      target => "@timestamp"
    }
  }

  mutate {
    lowercase => ["log_level"]
  }

  if ![service] and [log][file][path] {
    grok {
      match => { "[log][file][path]" => ".*\\\\(?<service>[^\\\\]+)\\\\[^\\\\]+\\.log(\\..*)?$" }
      tag_on_failure => ["_grok_service_from_path_failed"]
    }
  }

  if ![service] and [fields][service] {
    mutate { add_field => { "service" => "%{[fields][service]}" } }
  }

  if ![service] and [logger] {
    mutate { add_field => { "service" => "%{logger}" } }
  }

  if [log_level] == "error" or [log_level] == "critical" {
    mutate {
      add_field => { "should_alert" => "true" }
      add_field => { "alert_type" => "ERROR" }
    }
  } else if [log_level] == "warning" or [log_level] == "warn" {
    mutate {
      add_field => { "should_alert" => "true" }
      add_field => { "alert_type" => "WARNING" }
    }
  } else {
    mutate { add_field => { "should_alert" => "false" } }
  }

  if [log_event] =~ /ws_receive_error err=\(1001/ {
    mutate {
      replace => { "should_alert" => "false" }
      add_field => { "alert_suppressed_reason" => "websocket_client_went_away_1001" }
    }
  }


  if [should_alert] == "true" and "${DISCORD_WEBHOOK_URL}" != "" {
    ruby {
      init => 'require "json"'
      code => '
        begin
          service = event.get("service") || "unknown"
          alert_type = event.get("alert_type") || "ALERT"
          log_level = event.get("log_level") || ""
          log_event = event.get("log_event") || event.get("message") || ""
          timestamp = event.get("@timestamp") || ""
          server_name = event.get("server_name") || event.get("[host][name]") || "unknown"
          server_ip = event.get("server_ip") || "unknown"
          log_path = event.get("[log][file][path]") || "unknown"
          original = event.get("[event][original]") || event.get("message") || log_event
          error_hint = "No classifier matched. Check the original log and related service logs in Kibana."

          if log_event.to_s =~ /ws_receive_error err=\((\d+)/
            code = $1
            hints = {
              "1000" => "WebSocket closed normally.",
              "1001" => "WebSocket client went away, usually browser tab closed, page reload, network change, or client navigation.",
              "1006" => "WebSocket closed abnormally without a close frame, often network interruption or process crash.",
              "1011" => "WebSocket server hit an unexpected internal error.",
              "1012" => "WebSocket service restarted or is restarting."
            }
            error_hint = "WebSocket close code #{code}: #{hints[code] || "Unknown WebSocket close code."}"
          elsif log_event.to_s =~ /DuplicateKeyError|E11000/
            error_hint = "MongoDB duplicate key: the app tried to insert a document with an _id or unique key that already exists."
          elsif log_event.to_s =~ /Timeout reading from socket/
            error_hint = "Socket timeout: a dependency such as Redis or MongoDB did not respond before the read timeout."
          elsif log_event.to_s =~ /Connection closed by server/
            error_hint = "Dependency connection was closed by the remote server."
          end

          # Truncate to Discord limits
          service = service.to_s[0, 256]
          alert_type = alert_type.to_s[0, 256]
          log_level = log_level.to_s[0, 1024]
          log_event = log_event.to_s[0, 1800]
          timestamp = timestamp.to_s[0, 256]
          server_name = server_name.to_s[0, 1024]
          server_ip = server_ip.to_s[0, 1024]
          log_path = log_path.to_s[0, 1024]
          original = original.to_s[0, 1800]
          error_hint = error_hint.to_s[0, 1024]

          # Color: red for ERROR, orange for WARNING
          color = (alert_type == "ERROR") ? 15158332 : 16753920

          embed = {
            "title" => "#{alert_type} in #{service}",
            "description" => "```text\n#{log_event}\n```",
            "color" => color,
            "fields" => [
              {"name" => "Service", "value" => service, "inline" => true},
              {"name" => "Level", "value" => log_level.upcase, "inline" => true},
              {"name" => "Meaning", "value" => error_hint, "inline" => false},
              {"name" => "Server", "value" => "#{server_name} (#{server_ip})", "inline" => false},
              {"name" => "Timestamp", "value" => timestamp, "inline" => false},
              {"name" => "Log file", "value" => log_path, "inline" => false},
              {"name" => "Original log", "value" => "```text\n#{original}\n```", "inline" => false}
            ]
          }

          embed_payload = {"embeds" => [embed]}
          event.set("discord_embed_payload", embed_payload.to_json)
        rescue => e
          event.set("discord_ruby_error", e.message)
        end
      '
    }
  }

  mutate {
    remove_field => ["app_ts", "host", "agent", "ecs", "input", "tags"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTIC_HOSTS}"]
    user  => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"

    index => "btl-%{[service]}-%{+YYYY.MM.dd}"
  }

  # Send to Discord by webhook
  if [should_alert] == "true" and "${DISCORD_WEBHOOK_URL}" != "" and [discord_embed_payload] {
    http {
      url => "${DISCORD_WEBHOOK_URL}"
      http_method => "post"
      content_type => "application/json"
      format => "message"
      message => "%{[discord_embed_payload]}"

      retry_failed    => true
      retryable_codes => [500, 502, 503]

      headers => {
        "Content-Type" => "application/json"
      }
    }
  }

  if [should_alert] == "true" {
    stdout { codec => rubydebug { metadata => false } }
  }
}
